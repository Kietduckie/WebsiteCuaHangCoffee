<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thực đơn - Cafe Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/Style.css">
    <link rel="stylesheet" href="CSS/admin.css">
    <style>
        :root {
            --primary-color: #6F4E37;
            --secondary-color: #D2B48C;
            --bg-light: #F5EBE6;
            --text-dark: #3E2723;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        .admin-navbar {
            background-color: var(--primary-color) !important;
            border-bottom: 4px solid var(--secondary-color);
        }

            .admin-navbar .nav-link {
                color: rgba(255, 255, 255, 0.8) !important;
                font-weight: 600;
                padding: 10px 20px !important;
                border-radius: 4px;
            }

                .admin-navbar .nav-link:hover, .admin-navbar .nav-link.active {
                    background-color: var(--secondary-color) !important;
                    color: var(--text-dark) !important;
                }

        /* CẤU TRÚC CARD SẢN PHẨM PHÍA TRÊN LÀ ẢNH - PHÍA DƯỚI LÀ THÔNG TIN GIỐNG VIDEO MẪU */
        .menu-grid-card {
            background-color: #FFFFFF;
            border: 1px solid #E5D3C5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(111, 78, 55, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

            .menu-grid-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 6px 15px rgba(111, 78, 55, 0.1);
            }
        /* Khung giữ ảnh tỷ lệ cố định chống vỡ giao diện khi chưa có link ảnh thật */
        .menu-img-container {
            width: 100%;
            height: 180px;
            background-color: #EFE6E1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            position: relative;
            border-bottom: 1px solid #E5D3C5;
        }

            .menu-img-container img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(111, 78, 55, 0.85);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .menu-info {
            padding: 15px;
        }

        .menu-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-dark);
        }

        .menu-price {
            font-size: 1rem;
            font-weight: 700;
            color: #A94442;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg admin-navbar shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-mug-hot me-2"></i>Cafe Order</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-line me-1"></i>Báo cáo</a>
                    </li>
                    <li class="nav-item">
                        <a href="products.html" class="nav-link active"><i class="fa-solid fa-book-open me-1"></i>Quản lý Menu</a>
                    </li>
                    <li class="nav-item">
                        <a href="orders.html" class="nav-link"><i class="fa-solid fa-receipt me-1"></i>Quản lý đơn hàng</a>
                    </li>
                    <li class="nav-item">
                        <a href="customers.html" class="nav-link"><i class="fa-solid fa-users me-1"></i>Quản lý khách hàng</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary border-opacity-25">
            <h3 class="fw-bold m-0 text-uppercase">Quản lý thực đơn</h3>
            <button class="btn btn-success px-4 fw-semibold" data-bs-toggle="modal" data-bs-target="#productModal">
                <i class="fa-solid fa-plus me-2"></i>Thêm sản phẩm mới
            </button>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="menu-container">

            <div class="col">
                <div class="menu-grid-card">
                    <div class="menu-img-container">
                        <span class="category-badge">Cà phê truyền thống</span>
                        <i class="fa-solid fa-image fa-2xl opacity-50"></i>
                    </div>
                    <div class="menu-info">
                        <div class="menu-title">Cà phê đen đá</div>
                        <div class="menu-price">29,000đ</div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary flex-grow-1" data-bs-toggle="modal" data-bs-target="#productModal"><i class="fa-solid fa-pen me-1"></i>Sửa</button>
                            <button class="btn btn-sm btn-outline-danger flex-grow-1"><i class="fa-solid fa-trash me-1"></i>Xóa</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="menu-grid-card">
                    <div class="menu-img-container">
                        <span class="category-badge">Cà phê truyền thống</span>
                        <i class="fa-solid fa-image fa-2xl opacity-50"></i>
                    </div>
                    <div class="menu-info">
                        <div class="menu-title">Cà phê sữa đá</div>
                        <div class="menu-price">35,000đ</div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary flex-grow-1" data-bs-toggle="modal" data-bs-target="#productModal"><i class="fa-solid fa-pen me-1"></i>Sửa</button>
                            <button class="btn btn-sm btn-outline-danger flex-grow-1"><i class="fa-solid fa-trash me-1"></i>Xóa</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="menu-grid-card">
                    <div class="menu-img-container">
                        <span class="category-badge">Trà trái cây</span>
                        <i class="fa-solid fa-image fa-2xl opacity-50"></i>
                    </div>
                    <div class="menu-info">
                        <div class="menu-title">Trà đào cam sả</div>
                        <div class="menu-price">49,000đ</div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary flex-grow-1" data-bs-toggle="modal" data-bs-target="#productModal"><i class="fa-solid fa-pen me-1"></i>Sửa</button>
                            <button class="btn btn-sm btn-outline-danger flex-grow-1"><i class="fa-solid fa-trash me-1"></i>Xóa</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="menu-grid-card">
                    <div class="menu-img-container">
                        <span class="category-badge">Bánh ngọt</span>
                        <i class="fa-solid fa-image fa-2xl opacity-50"></i>
                    </div>
                    <div class="menu-info">
                        <div class="menu-title">Tiramisu</div>
                        <div class="menu-price">45,000đ</div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary flex-grow-1" data-bs-toggle="modal" data-bs-target="#productModal"><i class="fa-solid fa-pen me-1"></i>Sửa</button>
                            <button class="btn btn-sm btn-outline-danger flex-grow-1"><i class="fa-solid fa-trash me-1"></i>Xóa</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-dark" style="border-radius: 12px; border: none;">
                <div class="modal-header" style="background-color: var(--primary-color); color: white; border-top-left-radius: 12px; border-top-right-radius: 12px;">
                    <h5 class="modal-title fw-bold" id="modalTitle"><i class="fa-solid fa-box-open me-2"></i>Thông tin sản phẩm</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="productForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Mã sản phẩm (ID)</label>
                            <input type="text" class="form-control" placeholder="Ví dụ: CF01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Tên sản phẩm</label>
                            <input type="text" class="form-control" placeholder="Nhập tên thức uống / bánh" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-secondary">Danh mục</label>
                                <select class="form-select">
                                    <option>Cà phê truyền thống</option>
                                    <option>Espresso Coffee</option>
                                    <option>Trà trái cây</option>
                                    <option>Đá xay</option>
                                    <option>Bánh ngọt</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-secondary">Giá bán (đ)</label>
                                <input type="number" class="form-control" placeholder="Giá tiền" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Đường dẫn hình ảnh</label>
                            <input type="text" class="form-control" placeholder="images/ten-anh.jpg">
                        </div>
                        <div class="mb-0">
                            <label class="form-label small fw-bold text-secondary">Mô tả chi tiết</label>
                            <textarea class="form-control" rows="3" placeholder="Nhập vài câu mô tả sản phẩm..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer style-footer bg-light" style="border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" form="productForm" class="btn btn-sm btn-success px-3">Lưu dữ liệu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
