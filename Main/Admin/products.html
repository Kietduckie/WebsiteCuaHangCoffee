        .menu-grid-card {

            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(111, 78, 55, 0.04);

        .menu-img-container {
            width: 100%;

            justify-content: center;

            .menu-img-container img {

            }

        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(111, 78, 55, 0.85);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 8px;

            backdrop-filter: blur(4px);

        }

        .menu-info {

        .menu-title {

        .menu-price {

                                    <option value="coffee">C� ph� truy?n th?ng</option>
                                    <option value="espresso">Espresso Coffee</option>
                                    <option value="tea">Tr� tr�i c�y</option>
                                    <option value="ice">�� xay</option>
                                    <option value="cake">B�nh ng?t</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-secondary">Gi� b�n (d)</label>
                                <input type="number"
                                       id="prod-price"
                                       class="form-control"
                                       placeholder="Gi� ti?n"
                                       required />
                            </div>

                                   placeholder="V� d?: Images/ten_file.jpg" />
                        </div>

                            <textarea id="prod-desc"
                                      class="form-control"

                                      placeholder="Nh?p v�i c�u m� t? s?n ph?m..."></textarea>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const defaultProducts = [
            {
                id: "CF01",
                name: "C� Ph� �en ��",
                category: "coffee",
                price: 29000,
                img: "../Images/CF01.jpg",
                desc: "V? d?ng thu?n khi?t c?a c� ph� Robusta, h�a quy?n v?i d� l?nh t?o n�n s? t?nh t�o t?c th�.",
            },
            {
                id: "CF02",
                name: "C� Ph� S?a ��",
                category: "coffee",
                price: 35000,
                img: "../Images/CF02.jpg",
                desc: "S? k?t h?p h�i h�a gi?a c� ph� d?m d� v� s?a d?c ng?t ng�o. M?i ng?m l� m?t k? ni?m quen thu?c.",
            },
            {
                id: "CF03",
                name: "B?c X?u",
                category: "coffee",
                price: 39000,
                img: "../Images/CF03.jpg",
                desc: "�t c� ph�, nhi?u s?a � nh? nh�ng nhu bu?i s�ng y�n tinh d?u ti�n c?a tu?n.",
            },
            {
                id: "ES01",
                name: "Espresso",
                category: "espresso",
                price: 45000,
                img: "../Images/ES01.jpg",
                desc: "Thu?n khi?t v� m�nh li?t. M?t shot espresso d�ng chu?n v?i l?p crema v�ng d?m.",
            },
            {
                id: "ES02",
                name: "Americano",
                category: "espresso",
                price: 49000,
                img: "../Images/ES02.jpg",
                desc: "Espresso k�o d�i b?ng nu?c n�ng, t?o n�n d? d?u m� v?n gi? tr?n chi?u s�u huong v?.",
            },
        ];

        let products =
            JSON.parse(localStorage.getItem("cafe_menu")) || defaultProducts;
        if (!localStorage.getItem("cafe_menu")) {
            localStorage.setItem("cafe_menu", JSON.stringify(products));
        }

        const menuContainer = document.getElementById("menu-container");
        const productModal = new bootstrap.Modal(
            document.getElementById("productModal"),
        );
        const productForm = document.getElementById("productForm");
        let editTargetId = null;

        function getCategoryName(cat) {
            const cats = {
                coffee: "C� ph�",
                espresso: "Espresso",
                tea: "Tr�",
                ice: "�� xay",
                cake: "B�nh ng?t",
            };
            return cats[cat] || cat;
        }

        function renderMenu() {
            menuContainer.innerHTML = "";
            products.forEach((p) => {
                menuContainer.innerHTML += `
                <div class="col" data-id="${p.id}">
                    <div class="menu-grid-card">
                        <div class="menu-img-container">
                            <span class="category-badge">${getCategoryName(p.category)}</span>
                            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://placehold.co/300x180?text=No+Image'">
                        </div>
                        <div class="menu-info">
                            <div class="text-muted small mb-1">M�: ${p.id}</div>
                            <div class="menu-title">${p.name}</div>
                            <div class="menu-price">${Number(p.price).toLocaleString("vi-VN")}d</div>
                            <div class="menu-actions d-flex gap-2">
                                <button class="btn btn-sm btn-outline-primary w-100 btn-edit">
                                    <i class="fa-solid fa-pen me-1"></i>S?a
                                </button>
                                <button class="btn btn-sm btn-outline-danger w-100 btn-delete">
                                    <i class="fa-solid fa-trash me-1"></i>X�a
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            });
        }

        document
            .getElementById("btn-open-add-modal")
            .addEventListener("click", function () {
                editTargetId = null;
                productForm.reset();
                document.getElementById("prod-id").disabled = false;
                document.getElementById("modalTitle").innerHTML =
                    '<i class="fa-solid fa-plus me-2"></i>Th�m s?n ph?m m?i';
                productModal.show();
            });

        productForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const id = document.getElementById("prod-id").value.trim();
            const name = document.getElementById("prod-name").value.trim();
            const category = document.getElementById("prod-category").value; // now stores canonical key
            const price = parseInt(document.getElementById("prod-price").value);
            const img =
                document.getElementById("prod-img").value.trim() ||
                "../Images/default.jpg";
            const desc = document.getElementById("prod-desc").value.trim();

            if (editTargetId === null) {
                if (products.some((p) => p.id === id)) {
                    alert("M� s?n ph?m n�y d� t?n t?i!");
                    return;
                }
                products.push({ id, name, category, price, img, desc });
            } else {
                const idx = products.findIndex((p) => p.id === editTargetId);
                if (idx !== -1) {
                    products[idx] = { id: editTargetId, name, category, price, img, desc };
                }
            }

            localStorage.setItem("cafe_menu", JSON.stringify(products));
            window.dispatchEvent(new StorageEvent('storage', { key: 'cafe_menu', newValue: JSON.stringify(products) }));
            renderMenu();
            productModal.hide();
        });

        menuContainer.addEventListener("click", function (e) {
            const colTarget = e.target.closest(".col");
            if (!colTarget) return;
            const id = colTarget.getAttribute("data-id");

            if (e.target.closest(".btn-delete")) {
                const targetProd = products.find((p) => p.id === id);
                if (
                    confirm(`B?n c� ch?c ch?n mu?n x�a s?n ph?m "${targetProd.name}"?`)
                ) {
                    products = products.filter((p) => p.id !== id);
                    localStorage.setItem("cafe_menu", JSON.stringify(products));
                    renderMenu();
                }
            }

            if (e.target.closest(".btn-edit")) {
                const targetProd = products.find((p) => p.id === id);
                if (!targetProd) return;

                editTargetId = id;
                document.getElementById("prod-id").value = targetProd.id;
                document.getElementById("prod-id").disabled = true;
                document.getElementById("prod-name").value = targetProd.name;
                document.getElementById("prod-category").value = targetProd.category;
                document.getElementById("prod-price").value = targetProd.price;
                document.getElementById("prod-img").value = targetProd.img;
                document.getElementById("prod-desc").value = targetProd.desc || "";

                document.getElementById("modalTitle").innerHTML =
                    '<i class="fa-solid fa-pen me-2"></i>C?p nh?t th�ng tin s?n ph?m';
                productModal.show();
            }
        });

        document.addEventListener("DOMContentLoaded", renderMenu);
    </script>
