<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng Nhập | Bean & Brew</title>

    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    
    <link rel="stylesheet" href="CSS/Style.css" />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          rgba(140, 29, 36, 0.08),
          rgba(226, 135, 67, 0.08)
        );
      }

      .login-card {
        background: var(--light-neutral);
        border: none;
        border-radius: 20px;
        box-shadow: var(--shadow-md);
        overflow: hidden;
      }

      .login-header {
        background: var(--primary-color);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .login-header h2 {
        margin: 0;
        font-weight: 700;
      }

      .login-body {
        padding: 40px;
      }

      .input-group-text {
        background: var(--light-neutral);
        border: 1px solid var(--border-color);
      }

      .form-control {
        height: 50px;
      }

      .social-btn {
        height: 45px;
      }

      .back-home {
        color: var(--primary-color);
        font-weight: 600;
      }

      .back-home:hover {
        color: var(--accent-color);
      }
    </style>
    <style>
      
      :root {
        --primary-color: #6f4e37;
        --accent-color: #d2b48c;
      }
      
      .btn-coffee,
      .btn-primary {
        background-color: #6f4e37 !important;
        border-color: #6f4e37 !important;
        color: #fff !important;
        font-weight: 600;
      }

      .btn-coffee:hover,
      .btn-primary:hover {
        background-color: #5a3d2b !important;
        border-color: #5a3d2b !important;
      }

      .btn-coffee-outline {
        color: #6f4e37 !important;
        border-color: #6f4e37 !important;
        background-color: transparent !important;
        font-weight: 600;
      }

      .btn-coffee-outline:hover {
        background-color: #6f4e37 !important;
        color: #fff !important;
      }
      
      .text-warning {
        color: #d2b48c !important;
      }

      .border-warning {
        border-color: #d2b48c !important;
      }

      .logo {
        color: #6f4e37 !important;
      }

      a {
        color: #6f4e37;
      }

      a:hover {
        color: #5a3d2b;
      }
      
      .form-control:focus,
      .form-select:focus {
        border-color: #6f4e37 !important;
        box-shadow: 0 0 0 0.25rem rgba(111, 78, 55, 0.15) !important;
      }
      
      .form-check-input:checked {
        background-color: #6f4e37 !important;
        border-color: #6f4e37 !important;
      }
      
      .mega-menu h6.text-warning {
        color: #d2b48c !important;
        border-color: #d2b48c !important;
      }
      
      footer .bi.text-warning,
      footer h5.text-warning {
        color: #d2b48c !important;
      }
      
      body.login-page {
        background: linear-gradient(
          135deg,
          rgba(111, 78, 55, 0.1),
          rgba(210, 180, 140, 0.12)
        ) !important;
      }
      
      .login-header {
        background: #6f4e37 !important;
      }
      
      .accordion-button:not(.collapsed) {
        color: #6f4e37 !important;
        background-color: rgba(111, 78, 55, 0.07) !important;
        box-shadow: inset 0 -1px 0 rgba(111, 78, 55, 0.2) !important;
      }

      .accordion-button:focus {
        box-shadow: 0 0 0 0.25rem rgba(111, 78, 55, 0.15) !important;
      }
      
      .border-warning {
        border-color: #d2b48c !important;
      }

      .bi-award-fill.text-warning {
        color: #d2b48c !important;
      }
      
      .btn-outline-danger {
        color: #c0392b;
        border-color: #c0392b;
      }

      .btn-outline-primary {
        color: #3b5998;
        border-color: #3b5998;
      }
      
      .back-home {
        color: #6f4e37 !important;
      }

      .back-home:hover {
        color: #d2b48c !important;
      }
    </style>
  </head>

  <body class="login-page">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
          
          <div class="text-center mb-3">
            <button
              id="mode-toggle-btn"
              onclick="toggleMode()"
              class="btn btn-sm fw-semibold px-4 py-2"
              style="
                background: #fff;
                border: 2px solid #6f4e37;
                color: #6f4e37;
                border-radius: 20px;
                transition: all 0.3s;
              "
            >
              <i class="bi bi-person-fill me-1" id="mode-icon"></i>
              <span id="mode-label">Trạng thái đăng nhập: Khách hàng</span>
            </button>
          </div>

          <div class="card login-card">
            
            <div class="login-header" id="login-header">
              <h2><i class="bi bi-cup-hot-fill"></i> Bean & Brew</h2>
              <p class="mb-0 mt-2" id="header-subtitle">
                Chào mừng bạn quay trở lại
              </p>
            </div>

            
            <div class="login-body">
              
              <div id="form-customer">
                <form onsubmit="handleCustomerLogin(event)">
                  <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <div class="input-group">
                      <span class="input-group-text"
                        ><i class="bi bi-envelope-fill"></i
                      ></span>
                      <input
                        type="email"
                        class="form-control"
                        placeholder="Nhập email"
                        required
                      />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <div class="input-group">
                      <span class="input-group-text"
                        ><i class="bi bi-lock-fill"></i
                      ></span>
                      <input
                        type="password"
                        class="form-control"
                        placeholder="Nhập mật khẩu"
                        required
                      />
                    </div>
                  </div>
                  <div
                    class="d-flex justify-content-between align-items-center mb-4"
                  >
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember"
                      />
                      <label class="form-check-label" for="remember"
                        >Ghi nhớ đăng nhập</label
                      >
                    </div>
                    <a href="#">Quên mật khẩu?</a>
                  </div>
                  

                  <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">
                      <i class="bi bi-box-arrow-in-right"></i>
                      Đăng Nhập
                    </button>
                  </div>
                </form>

                <div class="text-center my-3">
                  <span class="text-muted">Hoặc đăng nhập bằng</span>
                </div>

                <div class="d-grid gap-2">
                  <a
                    href="https://accounts.google.com/"
                    target="_blank"
                    class="btn btn-outline-danger social-btn d-flex align-items-center justify-content-center"
                  >
                    <i class="bi bi-google me-2"></i>
                    Google
                  </a>

                  <a
                    href="https://www.facebook.com/login"
                    target="_blank"
                    class="btn btn-outline-primary social-btn d-flex align-items-center justify-content-center"
                  >
                    <i class="bi bi-facebook me-2"></i>
                    Facebook
                  </a>
                </div>
                <hr />

                <div class="text-center">
                  Chưa có tài khoản?
                  <a href="register.html" class="fw-bold">Đăng ký ngay</a>
                </div>
              </div>

              
              <div id="form-admin" style="display: none">
                <div
                  class="alert alert-warning py-2 small text-center mb-3"
                  style="
                    background: #fdf3e3;
                    border-color: #d2b48c;
                    color: #6f4e37;
                  "
                >
                  <i class="bi bi-shield-lock-fill me-1"></i>Khu vực dành riêng
                  cho quản lý
                </div>
                <form onsubmit="handleAdminLogin(event)">
                  <div class="mb-3">
                    <label class="form-label fw-bold">Tên đăng nhập</label>
                    <div class="input-group">
                      <span class="input-group-text"
                        ><i class="bi bi-person-badge-fill"></i
                      ></span>
                      <input
                        type="text"
                        id="admin-username"
                        class="form-control"
                        placeholder="Nhập tên quản lý"
                        required
                      />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <div class="input-group">
                      <span class="input-group-text"
                        ><i class="bi bi-lock-fill"></i
                      ></span>
                      <input
                        type="password"
                        id="admin-password"
                        class="form-control"
                        placeholder="Nhập mật khẩu"
                        required
                      />
                    </div>
                  </div>
                  
                  <div
                    id="admin-error"
                    class="alert alert-danger py-2 small text-center mb-3"
                    style="display: none"
                  >
                    <i class="bi bi-exclamation-circle me-1"></i>Sai tên đăng
                    nhập hoặc mật khẩu!
                  </div>
                  <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">
                      <i class="bi bi-shield-check me-1"></i>Đăng Nhập Quản Lý
                    </button>
                  </div>
                </form>
              </div>

              
              <div class="text-center mt-3">
                <a href="index.html" class="back-home">
                  <i class="bi bi-arrow-left"></i> Quay về Trang chủ
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    
    <button
      class="dark-mode-toggle"
      onclick="document.body.classList.toggle('dark-mode')"
    >
      <i class="bi bi-moon-fill"></i>
    </button>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let isAdminMode = false;

      function toggleMode() {
        isAdminMode = !isAdminMode;

        const btn = document.getElementById("mode-toggle-btn");
        const icon = document.getElementById("mode-icon");
        const label = document.getElementById("mode-label");
        const subtitle = document.getElementById("header-subtitle");
        const formCust = document.getElementById("form-customer");
        const formAdmin = document.getElementById("form-admin");
        const errorBox = document.getElementById("admin-error");

        if (isAdminMode) {
          label.textContent = "Trạng thái đăng nhập: Quản lý";
          icon.className = "bi bi-shield-fill me-1";
          btn.style.borderColor = "#3E2723";
          btn.style.color = "#3E2723";
          subtitle.textContent = "Đăng nhập dành cho quản lý";
          formCust.style.display = "none";
          formAdmin.style.display = "";
          errorBox.style.display = "none";
          document.getElementById("admin-username").value = "";
          document.getElementById("admin-password").value = "";
        } else {
          label.textContent = "Trạng thái đăng nhập: Khách hàng";
          icon.className = "bi bi-person-fill me-1";
          btn.style.borderColor = "#6F4E37";
          btn.style.color = "#6F4E37";
          subtitle.textContent = "Chào mừng bạn quay trở lại";
          formCust.style.display = "";
          formAdmin.style.display = "none";
        }
      }

      function handleCustomerLogin(e) {
        e.preventDefault();
        window.location.href = "index.html";
      }

      function handleAdminLogin(e) {
        e.preventDefault();
        const username = document.getElementById("admin-username").value.trim();
        const password = document.getElementById("admin-password").value.trim();
        const errorBox = document.getElementById("admin-error");

        if (username === "admin" && password === "123") {
          errorBox.style.display = "none";
          window.location.href = "Admin/dashboard.html";
        } else {
          errorBox.style.display = "";
          const card = document.querySelector(".login-card");
          card.style.animation = "shake 0.3s ease";
          setTimeout(() => (card.style.animation = ""), 400);
        }
      }
    </script>

    <style>
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }

        25% {
          transform: translateX(-6px);
        }

        75% {
          transform: translateX(6px);
        }
      }
    </style>
  </body>
</html>
